    <rect x="568" width="260" height="66" rx="12" fill="#1e3a8a"/>
    <text x="698" y="42" text-anchor="middle" fill="#dbeafe" font-size="20" font-weight="700">Choose another</text>
    <text x="1228" y="42" text-anchor="end" fill="#64748b" font-size="16">Decision is recorded in the audit trail</text>
  </g>
