<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized reconciliation review interface</title>
  <desc id="desc">A reconstructed review screen containing fictitious identifiers and masked values.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="790" rx="28" fill="url(#shell)"/>
  <rect x="54" y="48" width="1292" height="690" rx="20" fill="#0b1220" stroke="#475569" stroke-width="2"/>
  <rect x="54" y="48" width="1292" height="66" rx="20" fill="#171f2e"/>
  <circle cx="88" cy="81" r="9" fill="#f87171"/>
  <circle cx="118" cy="81" r="9" fill="#fbbf24"/>
  <circle cx="148" cy="81" r="9" fill="#4ade80"/>
  <text x="190" y="89" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Reconciliation review · Demo period</text>

  <rect x="86" y="142" width="1228" height="58" rx="12" fill="#422006" stroke="#f59e0b"/>
  <text x="110" y="178" fill="#fcd34d" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">SANITIZED RECONSTRUCTION — all identifiers and values below are fictitious or masked</text>

  <g transform="translate(86 226)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="1228" height="86" rx="14" fill="#111827" stroke="#334155"/>
    <text x="24" y="33" fill="#94a3b8" font-size="16">Institution</text>
    <text x="24" y="62" fill="#f8fafc" font-size="20" font-weight="700">Demo Bank</text>
    <text x="300" y="33" fill="#94a3b8" font-size="16">Batch</text>
    <text x="300" y="62" fill="#f8fafc" font-size="20" font-weight="700">DEMO-2026-06</text>
    <text x="610" y="33" fill="#94a3b8" font-size="16">Review state</text>
    <text x="610" y="62" fill="#fbbf24" font-size="20" font-weight="700">12 pending</text>
    <text x="910" y="33" fill="#94a3b8" font-size="16">Budget status</text>
    <text x="910" y="62" fill="#4ade80" font-size="20" font-weight="700">Within limits</text>
  </g>

  <g transform="translate(86 338)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="1228" height="250" rx="16" fill="#111827" stroke="#334155"/>
    <text x="26" y="42" fill="#e2e8f0" font-size="22" font-weight="700">Suggested match requiring review</text>
    <rect x="26" y="66" width="548" height="112" rx="13" fill="#172033"/>
    <text x="48" y="96" fill="#94a3b8" font-size="15">BANK MOVEMENT</text>
    <text x="48" y="130" fill="#f8fafc" font-size="22" font-weight="700">B-1042 · Transfer received</text>
    <text x="48" y="158" fill="#cbd5e1" font-size="18">2026-06-14 · $ ***.***,**</text>
    <rect x="654" y="66" width="548" height="112" rx="13" fill="#172033"/>
    <text x="676" y="96" fill="#94a3b8" font-size="15">LEDGER CANDIDATE</text>
    <text x="676" y="130" fill="#f8fafc" font-size="22" font-weight="700">L-7721 · Customer receipt</text>
    <text x="676" y="158" fill="#cbd5e1" font-size="18">2026-06-14 · $ ***.***,**</text>
    <path d="M574 122h80" stroke="#a855f7" stroke-width="4"/>
    <circle cx="614" cy="122" r="14" fill="#a855f7"/>
    <path d="M608 122l5 5 9-11" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="26" y="219" fill="#94a3b8" font-size="17">Model confidence</text>
    <text x="172" y="219" fill="#c4b5fd" font-size="18" font-weight="700">92%</text>
    <text x="270" y="219" fill="#94a3b8" font-size="17">Reason</text>
    <text x="340" y="219" fill="#cbd5e1" font-size="17">same date, amount and normalized reference</text>
  </g>

  <g transform="translate(86 616)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="260" height="66" rx="12" fill="#166534"/>
    <text x="130" y="42" text-anchor="middle" fill="#dcfce7" font-size="20" font-weight="700">Approve match</text>
