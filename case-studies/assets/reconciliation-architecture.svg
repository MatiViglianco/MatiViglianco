<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Production AI-assisted bank reconciliation architecture</title>
  <desc id="desc">A sanitized architecture diagram showing ingestion, normalization, deterministic matching, AI suggestions, human review, and audit history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <circle cx="1270" cy="100" r="210" fill="#38bdf8" opacity=".06"/>
  <circle cx="110" cy="720" r="230" fill="#a855f7" opacity=".06"/>
  <text x="76" y="78" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="700">Production reconciliation architecture</text>
  <text x="76" y="116" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="20">Deterministic rules first · AI only for unresolved candidates · Human approval for ambiguity</text>
  <rect x="76" y="140" width="1248" height="5" rx="3" fill="url(#accent)"/>

  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(76 210)">
      <rect width="250" height="150" rx="20" fill="#172033" stroke="#334155"/>
      <rect width="250" height="8" rx="4" fill="#38bdf8"/>
      <text x="24" y="47" fill="#e2e8f0" font-size="23" font-weight="700">1 · Ingestion</text>
      <text x="24" y="82" fill="#94a3b8" font-size="17">Bank statements</text>
      <text x="24" y="108" fill="#94a3b8" font-size="17">Accounting ledgers</text>
      <text x="24" y="134" fill="#94a3b8" font-size="17">Schema validation</text>
    </g>
    <g transform="translate(370 210)">
      <rect width="250" height="150" rx="20" fill="#172033" stroke="#334155"/>
      <rect width="250" height="8" rx="4" fill="#38bdf8"/>
      <text x="24" y="47" fill="#e2e8f0" font-size="23" font-weight="700">2 · Normalize</text>
      <text x="24" y="82" fill="#94a3b8" font-size="17">Dates and amounts</text>
      <text x="24" y="108" fill="#94a3b8" font-size="17">Descriptions and IDs</text>
      <text x="24" y="134" fill="#94a3b8" font-size="17">Duplicate detection</text>
    </g>
    <g transform="translate(664 210)">
      <rect width="250" height="150" rx="20" fill="#172033" stroke="#334155"/>
      <rect width="250" height="8" rx="4" fill="#22c55e"/>
      <text x="24" y="47" fill="#e2e8f0" font-size="23" font-weight="700">3 · Rule engine</text>
      <text x="24" y="82" fill="#94a3b8" font-size="17">Exact references</text>
      <text x="24" y="108" fill="#94a3b8" font-size="17">Amount/date windows</text>
      <text x="24" y="134" fill="#94a3b8" font-size="17">Candidate graph</text>
    </g>
    <g transform="translate(958 210)">
      <rect width="366" height="150" rx="20" fill="#172033" stroke="#334155"/>
      <rect width="366" height="8" rx="4" fill="#a855f7"/>
      <text x="24" y="47" fill="#e2e8f0" font-size="23" font-weight="700">4 · AI suggestions</text>
      <text x="24" y="82" fill="#94a3b8" font-size="17">Only unresolved components</text>
      <text x="24" y="108" fill="#94a3b8" font-size="17">Payload-size batching</text>
      <text x="24" y="134" fill="#94a3b8" font-size="17">Structured, validated output</text>
    </g>
  </g>

  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M326 285H360"/>
    <path d="M620 285H654"/>
    <path d="M914 285H948"/>
    <path d="M1140 360V442"/>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(760 455)">
      <rect width="564" height="146" rx="20" fill="#172033" stroke="#334155"/>
      <rect width="10" height="146" rx="5" fill="#f59e0b"/>
      <text x="34" y="44" fill="#e2e8f0" font-size="23" font-weight="700">5 · Human review</text>
      <text x="34" y="80" fill="#94a3b8" font-size="17">Approve, reject or correct ambiguous suggestions</text>
      <text x="34" y="109" fill="#94a3b8" font-size="17">Reviewer context and confidence stay attached</text>
    </g>
    <g transform="translate(76 455)">
      <rect width="620" height="146" rx="20" fill="#172033" stroke="#334155"/>
      <rect width="10" height="146" rx="5" fill="#14b8a6"/>
      <text x="34" y="44" fill="#e2e8f0" font-size="23" font-weight="700">6 · Audit and snapshots</text>
      <text x="34" y="80" fill="#94a3b8" font-size="17">Original files, normalized rows, decisions and usage history</text>
      <text x="34" y="109" fill="#94a3b8" font-size="17">Traceability by company, bank and reconciliation period</text>
    </g>
  </g>
  <path d="M760 528H706" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(76 655)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="1248" height="100" rx="20" fill="#0f172a" stroke="#334155"/>
    <text x="28" y="40" fill="#cbd5e1" font-size="20" font-weight="700">Cross-cutting production safeguards</text>
    <g fill="#94a3b8" font-size="17">
      <text x="28" y="73">Budget limits</text>
      <text x="210" y="73">Request limits</text>
      <text x="404" y="73">Model pricing</text>
      <text x="590" y="73">Logs and metrics</text>
      <text x="790" y="73">Safe fallbacks</text>
      <text x="968" y="73">160+ automated tests</text>
    </g>
  </g>
</svg>
