<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">ERP-Final architecture</title>
  <desc id="desc">Architecture diagram showing React, Django REST Framework, PostgreSQL, asynchronous integrations, fiscal provider boundaries, CI, and deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1400" height="790" rx="28" fill="url(#bg)"/>
  <text x="74" y="78" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">ERP-Final · modular operations platform</text>
  <text x="74" y="118" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="20">Business rules and data isolation stay in the backend; external effects cross explicit provider boundaries.</text>
  <rect x="74" y="142" width="1252" height="5" rx="3" fill="url(#accent)"/>

  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(74 205)">
      <rect width="260" height="132" rx="18" fill="#111827" stroke="#334155"/>
      <text x="24" y="42" fill="#e2e8f0" font-size="23" font-weight="700">Authenticated users</text>
      <text x="24" y="79" fill="#94a3b8" font-size="17">Operations · Finance</text>
      <text x="24" y="105" fill="#94a3b8" font-size="17">Billing · HR · Review</text>
    </g>
    <g transform="translate(414 205)">
      <rect width="300" height="132" rx="18" fill="#111827" stroke="#334155"/>
      <rect width="300" height="8" rx="4" fill="#38bdf8"/>
      <text x="24" y="48" fill="#e2e8f0" font-size="23" font-weight="700">React + Material UI</text>
      <text x="24" y="85" fill="#94a3b8" font-size="17">Dashboards and workflows</text>
      <text x="24" y="111" fill="#94a3b8" font-size="17">Cookie-based authentication</text>
    </g>
    <g transform="translate(794 205)">
      <rect width="532" height="132" rx="18" fill="#111827" stroke="#334155"/>
      <rect width="532" height="8" rx="4" fill="#a855f7"/>
      <text x="24" y="48" fill="#e2e8f0" font-size="23" font-weight="700">Django + Django REST Framework</text>
      <text x="24" y="85" fill="#94a3b8" font-size="17">Validation · permissions · idempotency · audit</text>
      <text x="24" y="111" fill="#94a3b8" font-size="17">Branch-scoped queries and domain services</text>
    </g>
  </g>

  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M334 271H404"/>
    <path d="M714 271H784"/>
    <path d="M1060 337V398"/>
  </g>

  <g transform="translate(74 420)" font-family="Segoe UI,Arial,sans-serif">
    <g>
      <rect width="300" height="142" rx="18" fill="#111827" stroke="#334155"/>
      <text x="24" y="43" fill="#e2e8f0" font-size="22" font-weight="700">PostgreSQL</text>
      <text x="24" y="80" fill="#94a3b8" font-size="17">Operational records</text>
      <text x="24" y="107" fill="#94a3b8" font-size="17">Historical migrations</text>
    </g>
    <g transform="translate(326)">
      <rect width="300" height="142" rx="18" fill="#111827" stroke="#334155"/>
      <text x="24" y="43" fill="#e2e8f0" font-size="22" font-weight="700">Import services</text>
      <text x="24" y="80" fill="#94a3b8" font-size="17">Banks · Getnet · CSV</text>
      <text x="24" y="107" fill="#94a3b8" font-size="17">Deduplication and batches</text>
    </g>
    <g transform="translate(652)">
      <rect width="300" height="142" rx="18" fill="#111827" stroke="#334155"/>
      <text x="24" y="43" fill="#e2e8f0" font-size="22" font-weight="700">OCR review</text>
      <text x="24" y="80" fill="#94a3b8" font-size="17">AI-assisted extraction</text>
      <text x="24" y="107" fill="#94a3b8" font-size="17">Human confirmation</text>
    </g>
    <g transform="translate(978)">
      <rect width="274" height="142" rx="18" fill="#111827" stroke="#334155"/>
      <text x="24" y="43" fill="#e2e8f0" font-size="22" font-weight="700">Fiscal boundary</text>
      <text x="24" y="80" fill="#94a3b8" font-size="17">Mock by default</text>
      <text x="24" y="107" fill="#94a3b8" font-size="17">ARCA when authorized</text>
    </g>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M1060 398C920 380 224 380 224 410"/>
    <path d="M1060 398C850 380 550 380 550 410"/>
    <path d="M1060 398C1000 380 876 380 876 410"/>
    <path d="M1060 398V410"/>
  </g>

  <g transform="translate(74 625)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="1252" height="100" rx="20" fill="#0f172a" stroke="#334155"/>
    <text x="28" y="39" fill="#e2e8f0" font-size="20" font-weight="700">Delivery and verification</text>
    <text x="28" y="72" fill="#94a3b8" font-size="17">GitHub Actions</text>
    <text x="210" y="72" fill="#94a3b8" font-size="17">86 backend tests</text>
    <text x="420" y="72" fill="#94a3b8" font-size="17">Playwright E2E</text>
    <text x="620" y="72" fill="#94a3b8" font-size="17">Docker</text>
    <text x="750" y="72" fill="#94a3b8" font-size="17">GitHub Pages</text>
    <text x="950" y="72" fill="#94a3b8" font-size="17">Guarded Dokploy deploy</text>
  </g>
</svg>
