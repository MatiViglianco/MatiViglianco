<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Measured impact of reconciliation optimization</title>
  <desc id="desc">Before and after metrics showing input tokens reduced by 43 percent, repeated rows eliminated, payload size reduced by 14 percent, and more than 160 tests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="76" y="82" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">Measured optimization impact</text>
  <text x="76" y="122" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="20">Representative production reconciliation · sanitized aggregate metrics</text>

  <g transform="translate(76 175)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="810" height="450" rx="24" fill="#111827" stroke="#334155"/>
    <text x="34" y="52" fill="#e2e8f0" font-size="25" font-weight="700">Input tokens per reconciliation</text>
    <text x="34" y="95" fill="#94a3b8" font-size="18">Before</text>
    <rect x="150" y="73" width="590" height="34" rx="17" fill="#3f3f46"/>
    <text x="675" y="97" text-anchor="end" fill="#f8fafc" font-size="18" font-weight="700">15,620</text>
    <text x="34" y="165" fill="#94a3b8" font-size="18">After</text>
    <rect x="150" y="143" width="340" height="34" rx="17" fill="url(#bar)"/>
    <text x="470" y="167" text-anchor="end" fill="#f8fafc" font-size="18" font-weight="700">9,014</text>
    <rect x="34" y="222" width="742" height="1" fill="#334155"/>
    <text x="34" y="292" fill="#c4b5fd" font-size="72" font-weight="800">−43%</text>
    <text x="34" y="330" fill="#e2e8f0" font-size="22" font-weight="700">less input context</text>
    <text x="34" y="370" fill="#94a3b8" font-size="18">Connected-component batching keeps related candidates</text>
    <text x="34" y="398" fill="#94a3b8" font-size="18">together and avoids sending the same bank row repeatedly.</text>
  </g>

  <g transform="translate(926 175)" font-family="Segoe UI,Arial,sans-serif">
    <g>
      <rect width="398" height="130" rx="20" fill="#111827" stroke="#334155"/>
      <text x="28" y="43" fill="#94a3b8" font-size="18">Repeated bank rows</text>
      <text x="28" y="94" fill="#f8fafc" font-size="42" font-weight="800">46 → 0</text>
      <circle cx="348" cy="76" r="24" fill="#22c55e" opacity=".2"/>
      <path d="M337 76l8 8 15-19" stroke="#4ade80" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(0 160)">
      <rect width="398" height="130" rx="20" fill="#111827" stroke="#334155"/>
      <text x="28" y="43" fill="#94a3b8" font-size="18">Payload size</text>
      <text x="28" y="94" fill="#f8fafc" font-size="42" font-weight="800">−14%</text>
      <path d="M320 52v46m0 0l-15-16m15 16l15-16" stroke="#38bdf8" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(0 320)">
      <rect width="398" height="130" rx="20" fill="#111827" stroke="#334155"/>
      <text x="28" y="43" fill="#94a3b8" font-size="18">Regression coverage</text>
      <text x="28" y="94" fill="#f8fafc" font-size="42" font-weight="800">160+ tests</text>
      <path d="M316 89h52M326 70l12 19 24-38" stroke="#a855f7" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <text x="76" y="704" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="17">Metrics describe one representative run and are not presented as a universal benchmark.</text>
</svg>
